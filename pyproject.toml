[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retreivr"
version = "1.1.12"
requires-python = ">=3.11,<3.12"
readme = "README.md"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# F: pyflakes (unused imports, redefinitions, undefined names)
# E9: syntax and runtime errors
select = ["F", "E9"]
